version: '3'

x-airflow-common:
  &airflow-common
  image: airflow-ecommerce
  environment:
    &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
  volumes:
    - ./dags:/opt/airflow/dags
    - ./:/opt/airflow/project   # your repo
  depends_on:
    - airflow-init

services:

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: -c "airflow db init && airflow users create \
      --username admin \
      --password admin \
      --firstname Muhammed \
      --lastname Ibrahim \
      --role Admin \
      --email admin@email.com"

  airflow-webserver:
    <<: *airflow-common
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler