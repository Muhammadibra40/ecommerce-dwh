version: "3.8"

x-airflow-common:
  &airflow-common
  image: airflow-ecommerce
  environment:
    &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
  volumes:
    - ./dags:/opt/airflow/dags
    - ./:/opt/airflow/project
  networks:
    - data-platform

services:

  # -----------------------------
  # Airflow Services
  # -----------------------------
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command: >
      -c "airflow db init &&
          airflow users create
          --username admin
          --password admin
          --firstname Muhammed
          --lastname Ibrahim
          --role Admin
          --email admin@email.com"

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      - airflow-init

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      - airflow-init

  # -----------------------------
  # Metabase (BI Tool)
  # -----------------------------
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    restart: always
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase_appdb
      MB_DB_PORT: 5432
      MB_DB_USER: metabase_user
      MB_DB_PASS: strongpassword
      MB_DB_HOST: db
    volumes:
      - metabase-data:/metabase-data
    depends_on:
      - db
    networks:
      - data-platform

  # -----------------------------
  # Postgres (Metabase DB)
  # -----------------------------
  db:
    image: postgres:14
    container_name: metabase_db
    restart: always
    environment:
      POSTGRES_DB: metabase_appdb
      POSTGRES_USER: metabase_user
      POSTGRES_PASSWORD: strongpassword
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - data-platform

# -----------------------------
# Networks & Volumes
# -----------------------------
networks:
  data-platform:
    driver: bridge

volumes:
  postgres-data:
  metabase-data: